name: watch

on:
  schedule:
    # 08:00-20:00 по Минску (UTC+3) каждые 2 часа = 05:00-17:00 UTC
    - cron: "17 5-17/2 * * *"
  workflow_dispatch:

permissions:
  actions: write   # чтобы отключить workflow после находки
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NEEDLES: ${{ vars.NEEDLES }}
      - name: Остановить расписание, если найдено
        if: hashFiles('found.flag') != ''
        run: gh workflow disable watch.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
